<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>로그인 | 냐르륵</title>

  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/login.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <h1 class="header__title">냐르륵</h1>
    </div>
  </header>

  <main class="main">
    <section class="login-section">
      <h2 class="page-title">로그인</h2>
      <p class="auth-description">최애 이야기가 시작되는 팬 라운지에 입장하세요.</p>

      <form id="loginForm" class="login-form">
        <div class="form-fields">
          <div class="form-group">
            <label for="email" class="form-label">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="이메일을 입력하세요"
            />
            <p class="helper-text" id="emailHelperText"></p>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">비밀번호</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="비밀번호를 입력하세요"
            />
            <p class="helper-text" id="passwordHelperText"></p>
          </div>
        </div>

        <button type="submit" class="login-button" id="loginButton" disabled>
          로그인
        </button>
      </form>

      <button type="button" class="signup-button" id="signupButton">
        회원가입
      </button>
    </section>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>

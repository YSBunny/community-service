<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>게시글 작성 | 냐르륵</title>

  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/post-form.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <button type="button" class="back-button" id="backButton" aria-label="뒤로 가기">
        ‹
      </button>

      <h1 class="header__title">냐르륵</h1>

      <div class="profile-menu-area">
        <button type="button" class="profile-button" id="profileMenuButton" aria-label="프로필 메뉴 열기">
          <img id="profileMenuButtonImage" alt="프로필 이미지" />
        </button>

        <nav class="profile-dropdown is-hidden" id="profileDropdown">
          <button type="button" class="profile-dropdown__item" id="profileEditButton">
            회원정보수정
          </button>

          <button type="button" class="profile-dropdown__item" id="passwordEditButton">
            비밀번호수정
          </button>

          <button type="button" class="profile-dropdown__item" id="logoutButton">
            로그아웃
          </button>
        </nav>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="form-section">
      <h2 class="page-title" id="formTitle">게시글 작성</h2>
      <p class="section-description">최애 소식과 팬심을 자유롭게 기록해보세요.</p>

      <form id="postForm" class="post-form">
        <div class="form-group">
          <label for="title" class="form-label">제목*</label>

          <input
            type="text"
            id="title"
            name="title"
            class="title-input"
            placeholder="제목을 입력해주세요. (최대 26글자)"
            maxlength="26"
          />
        </div>

        <div class="form-group form-group--content">
          <label for="content" class="form-label">내용*</label>

          <textarea
            id="content"
            name="content"
            class="content-textarea"
            placeholder="내용을 입력해주세요."
          ></textarea>

          <p class="helper-text" id="helperText"></p>
        </div>

        <div class="form-group form-group--image">
          <label for="postImage" class="form-label">이미지</label>

          <div class="file-row">
            <input
              type="file"
              id="postImage"
              name="postImage"
              class="file-input"
              accept="image/*"
            />
          </div>

          <p class="current-image-name is-hidden" id="currentImageName"></p>
        </div>

        <button type="submit" class="submit-button" id="submitButton" disabled>
          완료
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="./js/post-form.js"></script>
</body>
</html>

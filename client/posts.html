<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>팬 라운지 | 냐르륵</title>

  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/posts.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <h1 class="header__title">냐르륵</h1>

      <div class="profile-menu-area">
        <button type="button" class="profile-button" id="profileMenuButton" aria-label="프로필 메뉴 열기">
          <img id="profileMenuButtonImage" alt="프로필 이미지" />
        </button>

        <nav class="profile-dropdown is-hidden" id="profileDropdown">
          <button type="button" class="profile-dropdown__item" id="profileEditButton">
            회원정보수정
          </button>

          <button type="button" class="profile-dropdown__item" id="passwordEditButton">
            비밀번호수정
          </button>

          <button type="button" class="profile-dropdown__item" id="logoutButton">
            로그아웃
          </button>
        </nav>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="intro-section">
      <p>
        좋아하는 마음이 모이는 곳,<br />
        냐르륵 <strong>팬 라운지</strong>입니다.
      </p>
    </section>

    <section class="board-section">
      <div class="board-toolbar">
        <button type="button" class="write-button" id="writePostButton">
          게시글 작성
        </button>
      </div>

      <div class="post-list" id="postList"></div>
    </section>
  </main>

  <script type="module" src="./js/posts.js"></script>
</body>
</html>

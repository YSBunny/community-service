name: Frontend CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-main
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build React
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image reference
        id: result
        shell: bash
        run: |
          echo "reference=${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Show image digest
        run: echo "${{ steps.result.outputs.reference }}"

      - name: Request frontend deployment
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.BE_DISPATCH_TOKEN }}
          BE_REPOSITORY: ${{ vars.BE_REPOSITORY }}
          IMAGE_REFERENCE: ${{ steps.result.outputs.reference }}
        shell: bash
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${BE_REPOSITORY}/dispatches" \
            --data "$(jq -n \
              --arg image "${IMAGE_REFERENCE}" \
              '{
                event_type: "deploy-frontend",
                client_payload: {
                  component: "frontend",
                  image: $image
                }
              }')"
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>게시글 상세 | 아무 말 대잔치</title>

  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/post-detail.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <button type="button" class="back-button" id="backButton" aria-label="뒤로 가기">
        ‹
      </button>

      <h1 class="header__title">아무 말 대잔치</h1>

      <div class="profile-menu-area">
        <button type="button" class="profile-button" id="profileMenuButton" aria-label="프로필 메뉴 열기">
          <img id="profileMenuButtonImage" alt="프로필 이미지" />
        </button>

        <nav class="profile-dropdown is-hidden" id="profileDropdown">
          <button type="button" class="profile-dropdown__item" id="profileEditButton">
            회원정보수정
          </button>

          <button type="button" class="profile-dropdown__item" id="passwordEditButton">
            비밀번호수정
          </button>

          <button type="button" class="profile-dropdown__item" id="logoutButton">
            로그아웃
          </button>
        </nav>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 게시글 상세 영역 -->
    <article class="post-detail">
      <section class="post-header">
        <h2 class="post-title" id="postTitle"></h2>

        <div class="post-info-row">
          <div class="author-info">
            <div class="author-profile"></div>

            <strong class="author-name" id="postAuthor">
              더미 작성자 1
            </strong>

            <time class="post-date" id="postDate">
              2021-01-01 00:00:00
            </time>
          </div>

          <div class="post-actions">
            <button
              type="button"
              class="small-button"
              id="editPostButton"
            >
              수정
            </button>

            <button
              type="button"
              class="small-button"
              id="deletePostButton"
            >
              삭제
            </button>
          </div>
        </div>
      </section>

      <section class="post-body">
        <img
          class="post-image is-hidden"
          id="postImage"
          alt="게시글 이미지"
        />

        <p class="post-content" id="postContent"></p>

        <div class="post-stats">
          <div class="stat-box">
            <strong id="likeCount">123</strong>
            <span>좋아요수</span>
          </div>

          <div class="stat-box">
            <strong id="viewCount">123</strong>
            <span>조회수</span>
          </div>

          <div class="stat-box">
            <strong id="commentCount">0</strong>
            <span>댓글수</span>
          </div>
        </div>
      </section>
    </article>

    <!-- 댓글 영역 -->
    <section class="comment-section">
      <form
        class="comment-form"
        id="commentForm"
        data-mode="create"
      >
        <textarea
          id="commentInput"
          name="comment"
          placeholder="댓글을 남겨주세요!"
        ></textarea>

        <div class="comment-form-footer">
          <button
            type="submit"
            class="comment-submit-button"
            id="commentSubmitButton"
            disabled
          >
            댓글 등록
          </button>
        </div>
      </form>

      <!-- 댓글은 API 응답에 따라 JS에서 추가 -->
      <div class="comment-list" id="commentList"></div>
    </section>
  </main>

  <div class="modal-overlay is-hidden" id="deletePostModal">
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="deletePostModalTitle"
    >
      <h2 class="modal__title" id="deletePostModalTitle">
        게시글을 삭제하시겠습니까?
      </h2>

      <p class="modal__description">
        삭제한 내용은 복구 할 수 없습니다.
      </p>

      <div class="modal__actions">
        <button type="button" class="modal__button modal__button--cancel" id="cancelDeleteButton">
          취소
        </button>

        <button type="button" class="modal__button modal__button--confirm" id="confirmDeleteButton">
          확인
        </button>
      </div>
    </section>
  </div>

  <div class="modal-overlay is-hidden" id="deleteCommentModal">
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="deleteCommentModalTitle"
    >
      <h2 class="modal__title" id="deleteCommentModalTitle">
        댓글을 삭제하시겠습니까?
      </h2>

      <p class="modal__description">
        삭제한 내용은 복구 할 수 없습니다.
      </p>

      <div class="modal__actions">
        <button
          type="button"
          class="modal__button modal__button--cancel"
          id="cancelDeleteCommentButton"
        >
          취소
        </button>

        <button
          type="button"
          class="modal__button modal__button--confirm"
          id="confirmDeleteCommentButton"
        >
          확인
        </button>
      </div>
    </section>
  </div>

  <script type="module" src="./js/post-detail.js"></script>
</body>
</html>

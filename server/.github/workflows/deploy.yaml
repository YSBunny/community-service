name: Production Deployment

on:
  repository_dispatch:
    types:
      - deploy-frontend
      - deploy-backend

  workflow_dispatch:
    inputs:
      component:
        description: 배포 대상
        required: true
        type: choice
        options:
          - all
          - frontend
          - backend

      frontend_image:
        description: all 또는 frontend 배포용 FE digest
        required: false
        type: string

      backend_image:
        description: all 또는 backend 배포용 BE digest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Resolve deployment inputs
        id: deploy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_COMPONENT: ${{ github.event.client_payload.component }}
          DISPATCH_IMAGE: ${{ github.event.client_payload.image }}
          MANUAL_COMPONENT: ${{ inputs.component }}
          MANUAL_FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          MANUAL_BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: |
          if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
            component="${DISPATCH_COMPONENT}"

            case "${component}" in
              frontend)
                frontend_image="${DISPATCH_IMAGE}"
                backend_image=""
                ;;
              backend)
                frontend_image=""
                backend_image="${DISPATCH_IMAGE}"
                ;;
              *)
                echo "허용되지 않은 component입니다."
                exit 1
                ;;
            esac
          else
            component="${MANUAL_COMPONENT}"
            frontend_image="${MANUAL_FRONTEND_IMAGE}"
            backend_image="${MANUAL_BACKEND_IMAGE}"
          fi

          image_pattern='^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+@sha256:[0-9a-f]{64}$'

          case "${component}" in
            all)
              [[ "${frontend_image}" =~ ${image_pattern} ]]
              [[ "${backend_image}" =~ ${image_pattern} ]]
              ;;
            frontend)
              [[ "${frontend_image}" =~ ${image_pattern} ]]
              ;;
            backend)
              [[ "${backend_image}" =~ ${image_pattern} ]]
              ;;
            *)
              echo "허용되지 않은 component입니다."
              exit 1
              ;;
          esac

          echo "component=${component}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${frontend_image}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${backend_image}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_deploy
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Create remote deployment directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p /home/ubuntu/nyareureuk/nginx"

      - name: Upload deployment files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/id_deploy \
            deploy/compose.yml \
            deploy/deploy.sh \
            "${EC2_USER}@${EC2_HOST}:/home/ubuntu/nyareureuk/"

          scp -i ~/.ssh/id_deploy \
            deploy/nginx/default.conf \
            "${EC2_USER}@${EC2_HOST}:/home/ubuntu/nyareureuk/nginx/default.conf"

      - name: Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          COMPONENT: ${{ steps.deploy.outputs.component }}
          FRONTEND_IMAGE: ${{ steps.deploy.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ steps.deploy.outputs.backend_image }}
        shell: bash
        run: |
          case "${COMPONENT}" in
            all)
              command="./deploy.sh all '${FRONTEND_IMAGE}' '${BACKEND_IMAGE}'"
              ;;
            frontend)
              command="./deploy.sh frontend '${FRONTEND_IMAGE}'"
              ;;
            backend)
              command="./deploy.sh backend '${BACKEND_IMAGE}'"
              ;;
          esac

          ssh -i ~/.ssh/id_deploy \
            "${EC2_USER}@${EC2_HOST}" \
            "cd /home/ubuntu/nyareureuk && chmod 700 deploy.sh && ${command}"